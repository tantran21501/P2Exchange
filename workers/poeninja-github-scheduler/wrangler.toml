name = "p2exchange-poeninja-github-scheduler"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = false

[observability]
enabled = true

[triggers]
crons = [ "7 * * * *", "17 * * * *" ]

[vars]
GITHUB_OWNER = "tantran21501"
GITHUB_REPO = "P2Exchange"
GITHUB_REF = "main"
REWARD_WORKFLOW = "poeninja-reward-price-snapshot.yml"
FULL_CATEGORY_WORKFLOW = "poeninja-full-category-snapshot.yml"

[secrets]
required = [ "GITHUB_ACTIONS_DISPATCH_TOKEN" ]
