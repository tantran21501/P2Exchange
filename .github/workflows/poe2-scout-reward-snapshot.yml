name: POE2 Scout Reward Snapshot

on:
  # Temporarily disable the scheduled Scout worker while testing poe.ninja pricing.
  workflow_dispatch:
    inputs:
      league:
        description: 'POE2 Scout league name, for example "Forbidden Rites"'
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: poe2-scout-reward-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test*.py'

      - name: Fetch POE2 Scout reward snapshot
        env:
          SCOUT_LEAGUE: ${{ inputs.league || vars.SCOUT_LEAGUE || 'Forbidden Rites' }}
          SCOUT_REFERENCE_CURRENCIES: "exalted,divine"
          SCOUT_USER_AGENT: ${{ vars.SCOUT_USER_AGENT || 'P2Exchange-POE2ScoutRewardSnapshot/1.0 (github-actions)' }}
          SCOUT_TIMEOUT: "30"
          SCOUT_RETRIES: "4"
        run: python3 scripts/fetch_scout_snapshot.py --output data/current.json

      - name: Validate snapshot
        run: |
          test -s data/current.json
          python3 -m json.tool data/current.json >/dev/null
          python3 - <<'PY'
          import json

          with open("data/current.json", encoding="utf-8") as handle:
              data = json.load(handle)

          stats = data["stats"]
          print("league=", data["league"])
          print("reference_currencies=", data["reference_currencies"])
          print("priced=", stats["priced"])
          print("unpriced=", stats["unpriced"])

          if data["source"] != "poe2scout":
              raise SystemExit("Unexpected source")
          if data["reference_currencies"] != ["exalted", "divine"]:
              raise SystemExit("Unexpected reference currencies")
          if stats["requested"] == 0:
              raise SystemExit("No rewards requested")
          if stats["priced"] == 0:
              raise SystemExit("No rewards were priced")
          if not any(row.get("price_exalted") is not None for row in data["rewards"]):
              raise SystemExit("No rewards have Exalted prices")
          if not any(row.get("price_divine") is not None for row in data["rewards"]):
              raise SystemExit("No rewards have Divine prices")
          PY

      - name: Build compact currency data
        run: python3 scripts/build_currency_json.py --input data/current.json --output data/currency.json

      - name: Validate compact currency data
        run: |
          test -s data/currency.json
          python3 -m json.tool data/currency.json >/dev/null
          python3 - <<'PY'
          import json

          with open("data/currency.json", encoding="utf-8") as handle:
              data = json.load(handle)

          league = data.get("league")
          league = (league.get("value") or league.get("name")) if isinstance(league, dict) else league
          if league != "Forbidden Rites":
              raise SystemExit("currency.json league must be Forbidden Rites")

          rewards = data["rewards"]
          if not isinstance(rewards, list) or not rewards:
              raise SystemExit("currency.json rewards must be a non-empty array")

          allowed = {"name", "matched_api_id", "price_exalted", "price_divine"}
          for index, reward in enumerate(rewards):
              if set(reward) != allowed:
                  raise SystemExit(f"Unexpected fields in currency reward #{index}: {sorted(reward)}")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/currency.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update POE2 Scout reward snapshot"
          git push
