name: POE2 Scout Price Snapshot

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      league:
        description: 'Exact poe.ninja league name'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: poe2-reward-price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch compact reward snapshot
        env:
          NINJA_LEAGUE: ${{ inputs.league || vars.NINJA_LEAGUE || vars.SCOUT_LEAGUE || 'Runes of Aldur' }}
          NINJA_USER_AGENT: ${{ vars.NINJA_USER_AGENT || 'POE2-Expedition-Radar-CurrencySnapshot/3.0 (github.com/tantran21501/P2Exchange)' }}
          NINJA_TIMEOUT: '30'
          NINJA_RETRIES: '4'
          SNAPSHOT_RETENTION_DAYS: ${{ vars.SNAPSHOT_RETENTION_DAYS || '30' }}
        run: python scripts/fetch_snapshot.py

      - name: Verify output
        run: |
          test -s data/current.json
          test -s data/meta.json
          python -m json.tool data/current.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/current.json'))
          print('priced=', d['stats']['priced'], 'failed=', d['stats']['failed'])
          print('categories=', d['categories_fetched'])
          if d['stats']['priced'] == 0:
              raise SystemExit('No rewards were priced')
          PY

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json data/meta.json data/snapshots
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore(data): update POE2 reward price snapshot'
          git push
