name: POE2 Scout Currency Snapshot
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      league:
        description: 'Optional exact POE2 Scout league name'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: poe2-scout-currency-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch Scout snapshot
        env:
          SCOUT_REALM: ${{ vars.SCOUT_REALM || 'poe2' }}
          SCOUT_LEAGUE: ${{ inputs.league || vars.SCOUT_LEAGUE }}
          SCOUT_USER_AGENT: ${{ vars.SCOUT_USER_AGENT || 'POE2-Expedition-Radar-CurrencySnapshot/1.0' }}
          SNAPSHOT_RETENTION_DAYS: ${{ vars.SNAPSHOT_RETENTION_DAYS || '30' }}
        run: python scripts/fetch_snapshot.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json data/meta.json data/snapshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(data): update POE2 currency snapshot'
          git push
