name: POE2 Scout Currency Snapshot

on:
  schedule:
    # Run at 5 minutes past every hour (UTC)
    - cron: '5 * * * *'

  workflow_dispatch:
    inputs:
      league:
        description: 'Optional exact POE2 Scout league name'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: poe2-scout-currency-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------------------------------------------------------------
      # Fetch POE2 Scout data
      # ------------------------------------------------------------
      - name: Fetch Scout snapshot
        env:
          SCOUT_API_BASE: ${{ vars.SCOUT_API_BASE || 'https://api.poe2scout.com' }}
          SCOUT_REALM: ${{ vars.SCOUT_REALM || 'poe2' }}

          # Priority:
          # 1. Manual workflow_dispatch league
          # 2. Repository variable SCOUT_LEAGUE
          # 3. Default league
          SCOUT_LEAGUE: ${{ inputs.league || vars.SCOUT_LEAGUE || 'Runes of Aldur' }}

          SCOUT_USER_AGENT: ${{ vars.SCOUT_USER_AGENT || 'POE2-Expedition-Radar-CurrencySnapshot/1.0' }}

          SCOUT_TIMEOUT: '30'
          SCOUT_RETRIES: '3'

          SNAPSHOT_RETENTION_DAYS: ${{ vars.SNAPSHOT_RETENTION_DAYS || '30' }}

        run: |
          python scripts/fetch_snapshot.py

      # ------------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------------
      - name: Verify generated snapshot
        run: |
          echo "=== current.json ==="
          test -f data/current.json

          echo "=== meta.json ==="
          test -f data/meta.json

          echo "=== Snapshot files ==="
          find data/snapshots -type f -name '*.json' | sort | tail -10

          echo "=== meta.json ==="
          cat data/meta.json

      # ------------------------------------------------------------
      # Commit snapshot
      # ------------------------------------------------------------
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/current.json
          git add data/meta.json
          git add data/snapshots

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): update POE2 currency snapshot"
          git push