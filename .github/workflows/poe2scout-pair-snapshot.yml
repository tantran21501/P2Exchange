name: POE2 Scout Pair Snapshot

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'POE2 Scout league name; empty selects current softcore'
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: poe2scout-pair-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    environment: MARKET_SYNC_WEBHOOK_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select current hourly folder
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          print(f"PAIR_SNAPSHOT_TIME={now.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"SNAPSHOT_DIR=data/snapshots/{now.strftime('%d%m%y_%H')}")
          PY
      - name: Fetch and compact POE2 Scout pair books
        env:
          SCOUT_LEAGUE: ${{ inputs.league || vars.SCOUT_LEAGUE || 'current' }}
          SCOUT_USER_AGENT: ${{ vars.SCOUT_USER_AGENT || 'P2Exchange-POE2ScoutPairSnapshot/1.0 (github-actions)' }}
          SCOUT_TIMEOUT: "30"
          SCOUT_RETRIES: "4"
        run: python3 scripts/fetch_scout_pairs_snapshot.py --snapshots-dir data/snapshots
      - name: Validate compact pair books
        run: |
          test -d "$SNAPSHOT_DIR"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["SNAPSHOT_DIR"])
          manifest = json.loads((folder / "_manifest.json").read_text(encoding="utf-8"))
          stats = manifest.get("pair_books") or {}
          if stats.get("source") != "poe2scout-snapshot-pairs" or int(stats.get("total") or 0) <= 0:
              raise SystemExit("No valid compact pair books were produced")
          allowed = {"from", "to", "rate", "available_from", "available_to", "volume",
                     "trade_count", "observed_at", "source", "observed", "independent"}
          for path in folder.glob("*.json"):
              if path.name.startswith("_"):
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              for pair in payload.get("pairs") or []:
                  if (set(pair) != allowed or not pair["observed"] or pair["independent"] or
                          pair["source"] != "poe2scout-snapshot-estimate" or pair["rate"] <= 0):
                      raise SystemExit(f"Invalid compact pair in {path}")
          print("compact_pair_total=", stats["total"])
          PY
      - name: Commit compact pair books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_DIR"
          if git diff --cached --quiet; then
            echo "No pair changes to commit."
            exit 0
          fi
          git commit -m "chore(data): add POE2 Scout pair books"
          git push
      - name: Notify Economy Radar market sync
        if: success()
        env:
          MARKET_SYNC_WEBHOOK_URL: ${{ vars.MARKET_SYNC_WEBHOOK_URL }}
          MARKET_SYNC_WEBHOOK_SECRET: ${{ secrets.MARKET_SYNC_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, subprocess, time
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          url = os.environ.get("MARKET_SYNC_WEBHOOK_URL", "").strip()
          secret = os.environ.get("MARKET_SYNC_WEBHOOK_SECRET", "")
          if not url or not secret:
              raise SystemExit("Market sync webhook URL/secret is not configured")
          folder = Path(os.environ["SNAPSHOT_DIR"])
          manifest = json.loads((folder / "_manifest.json").read_text(encoding="utf-8"))
          pair_books = manifest.get("pair_books") or {}
          body = json.dumps({
              "snapshot_folder": folder.name,
              "commit_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "completed_at": pair_books["observed_at"],
              "pair_books_total": int(pair_books["total"]),
          }, separators=(",", ":")).encode()
          path = urlsplit(url).path
          for attempt in range(3):
              timestamp, nonce = str(int(time.time())), secrets.token_hex(24)
              canonical = "\n".join(["POST", path, timestamp, nonce, hashlib.sha256(body).hexdigest()])
              signature = hmac.new(secret.encode(), canonical.encode(), hashlib.sha256).hexdigest()
              request = Request(url, data=body, method="POST", headers={
                  "Content-Type": "application/json", "X-Market-Timestamp": timestamp,
                  "X-Market-Nonce": nonce, "X-Market-Signature": signature,
                  "User-Agent": "P2Exchange-Market-Sync/1.0",
              })
              try:
                  with urlopen(request, timeout=60) as response:
                      if 200 <= response.status < 300:
                          print(response.read().decode())
                          break
              except HTTPError as exc:
                  detail = exc.read().decode(errors="replace")[:500]
                  if attempt == 2:
                      raise RuntimeError(f"Webhook HTTP {exc.code}: {detail}") from exc
                  print(f"Webhook attempt {attempt + 1} failed: HTTP {exc.code}: {detail}")
                  time.sleep(10 * (attempt + 1))
              except Exception as exc:
                  if attempt == 2:
                      raise
                  print(f"Webhook attempt {attempt + 1} failed: {exc}")
                  time.sleep(10 * (attempt + 1))
          PY
