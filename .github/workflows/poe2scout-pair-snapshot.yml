name: POE2 Scout Pair Snapshot

on:
  workflow_dispatch:
    inputs:
      market_target:
        description: 'Market destination for staging verification'
        type: choice
        options: [production, staging]
        default: production
      league:
        description: 'POE2 Scout league name; Forbidden Rites softcore'
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: economy-radar-market-sync
  cancel-in-progress: false

jobs:
  snapshot:
    environment: MARKET_SYNC_WEBHOOK_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select latest full category folder
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          CATEGORIES = ("Abyss", "Breach", "Currency", "Delirium", "Essences", "Expedition",
                        "Fragments", "Idols", "LineageSupportGems", "Ritual", "Runes",
                        "SoulCores", "UncutGems", "Verisium")
          def league_value(value):
              return (value.get("value") or value.get("name")) if isinstance(value, dict) else value
          candidates = []
          for folder in Path("data/snapshots").glob("??????_??"):
              manifest_path = folder / "_manifest.json"
              if not manifest_path.exists():
                  continue
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if league_value(manifest.get("league")) != "Forbidden Rites":
                  continue
              if all((folder / f"{category}.json").exists() for category in CATEGORIES):
                  candidates.append(folder)
          if not candidates:
              raise SystemExit("No completed Forbidden Rites category snapshot found")
          folder = max(candidates, key=lambda path: datetime.strptime(path.name, "%d%m%y_%H"))
          now = datetime.now(timezone.utc)
          print(f"PAIR_SNAPSHOT_TIME={now.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"SNAPSHOT_DIR={folder.as_posix()}")
          PY
      - name: Fetch and compact POE2 Scout pair books
        env:
          SCOUT_LEAGUE: ${{ inputs.league || vars.SCOUT_LEAGUE || 'Forbidden Rites' }}
          SCOUT_USER_AGENT: ${{ vars.SCOUT_USER_AGENT || 'P2Exchange-POE2ScoutPairSnapshot/1.0 (github-actions)' }}
          SCOUT_TIMEOUT: "30"
          SCOUT_RETRIES: "4"
        run: python3 scripts/fetch_scout_pairs_snapshot.py --snapshot-dir "$SNAPSHOT_DIR"
      - name: Validate compact pair books
        run: |
          test -d "$SNAPSHOT_DIR"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["SNAPSHOT_DIR"])
          manifest = json.loads((folder / "_manifest.json").read_text(encoding="utf-8"))
          stats = manifest.get("pair_books") or {}
          if stats.get("source") != "poe2scout-snapshot-pairs" or int(stats.get("total") or 0) <= 0:
              raise SystemExit("No valid compact pair books were produced")
          allowed = {"from", "to", "rate", "available_from", "available_to", "volume",
                     "trade_count", "observed_at", "source", "observed", "independent"}
          for path in folder.glob("*.json"):
              if path.name.startswith("_"):
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              for pair in payload.get("pairs") or []:
                  if (set(pair) != allowed or not pair["observed"] or pair["independent"] or
                          pair["source"] != "poe2scout-snapshot-estimate" or pair["rate"] <= 0):
                      raise SystemExit(f"Invalid compact pair in {path}")
          print("compact_pair_total=", stats["total"])
          PY
      - name: Commit compact pair books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_DIR"
          if git diff --cached --quiet; then
            echo "No pair changes to commit."
            exit 0
          fi
          git commit -m "chore(data): add POE2 Scout pair books"
          git push
      - name: Notify Economy Radar market sync
        if: success()
        env:
          MARKET_SYNC_WEBHOOK_URL: ${{ inputs.market_target == 'staging' && 'https://poe2-market-ingest-staging.tantnlamma.workers.dev' || vars.MARKET_SYNC_WEBHOOK_URL }}
          MARKET_COMPACT_WEBHOOK_SECRET: ${{ inputs.market_target == 'staging' && secrets.STAGING_MARKET_COMPACT_WEBHOOK_SECRET || secrets.MARKET_COMPACT_WEBHOOK_SECRET }}
        run: python3 scripts/sync_market_snapshot.py --snapshot-dir "$SNAPSHOT_DIR"
