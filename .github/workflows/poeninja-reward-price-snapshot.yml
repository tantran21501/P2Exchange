name: POE Ninja Reward Price Snapshot
# scheduler test
on:
  schedule:
    - cron: "37 * * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      league:
        description: 'poe.ninja league id, for example "Runes of Aldur"'
        required: false
        type: string
        default: ""
      league_name:
        description: 'poe.ninja league name fallback, for example "Runes of Aldur"'
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: poeninja-reward-price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Fetch poe.ninja reward snapshot
        env:
          NINJA_LEAGUE: ${{ inputs.league || vars.NINJA_LEAGUE || '' }}
          NINJA_LEAGUE_NAME: ${{ inputs.league_name || vars.NINJA_LEAGUE_NAME || '' }}
          NINJA_REFERENCE_CURRENCIES: "exalted,divine"
          NINJA_USER_AGENT: ${{ vars.NINJA_USER_AGENT || 'P2Exchange-POENinjaRewardSnapshot/1.0 (github-actions)' }}
          NINJA_TIMEOUT: "30"
          NINJA_RETRIES: "4"
        run: python3 scripts/fetch_poeninja_snapshot.py --output data/current.json

      - name: Validate snapshot
        run: |
          test -s data/current.json
          python3 -m json.tool data/current.json >/dev/null
          python3 - <<'PY'
          import json

          with open("data/current.json", encoding="utf-8") as handle:
              data = json.load(handle)

          stats = data["stats"]
          print("league=", data["league"])
          print("reference_currencies=", data["reference_currencies"])
          print("categories_fetched=", data["categories_fetched"])
          print("priced=", stats["priced"])
          print("unpriced=", stats["unpriced"])

          if data["source"] != "poeninja":
              raise SystemExit("Unexpected source")
          if data["reference_currencies"] != ["exalted", "divine"]:
              raise SystemExit("Unexpected reference currencies")
          if stats["requested"] == 0:
              raise SystemExit("No rewards requested")
          if stats["priced"] == 0:
              raise SystemExit("No rewards were priced")
          if "Currency" not in data["categories_fetched"]:
              raise SystemExit("Currency category was not fetched")
          if not any(row.get("price_exalted") is not None for row in data["rewards"]):
              raise SystemExit("No rewards have Exalted prices")
          if not any(row.get("price_divine") is not None for row in data["rewards"]):
              raise SystemExit("No rewards have Divine prices")
          PY

      - name: Build compact currency data
        run: python3 scripts/build_currency_json.py --input data/current.json --output data/currency.json

      - name: Validate compact currency data
        run: |
          test -s data/currency.json
          python3 -m json.tool data/currency.json >/dev/null
          python3 - <<'PY'
          import json

          with open("data/currency.json", encoding="utf-8") as handle:
              data = json.load(handle)

          if list(data) != ["rewards"]:
              raise SystemExit("currency.json must only contain the rewards array")

          rewards = data["rewards"]
          if not isinstance(rewards, list) or not rewards:
              raise SystemExit("currency.json rewards must be a non-empty array")

          allowed = {"name", "matched_api_id", "price_exalted", "price_divine"}
          for index, reward in enumerate(rewards):
              if set(reward) != allowed:
                  raise SystemExit(f"Unexpected fields in currency reward #{index}: {sorted(reward)}")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/currency.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update poe.ninja reward snapshot"
          git push
